<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROSA-BET - Five AIs One Verdict</title>
<style>
body{margin:0;background:#080c1a;color:#e6ebff;font-family:system-ui;padding:12px}
.h1{font-size:26px;font-weight:900;text-align:center;margin:10px 0} .h1 span{color:#FFD700}
.sub{color:#8a93b5;text-align:center;margin-bottom:12px}
.card{background:#121a33;border:1px solid #1f2a52;border-radius:16px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;font-size:12px;color:#8a93b5}
.conf{background:#1a2a5e;color:#FFD700;padding:4px 8px;border-radius:20px;font-weight:800}
.models{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.m{background:#0e1731;border-radius:10px;padding:6px;text-align:center;font-size:11px} .m b{display:block;color:#FFD700;font-size:13px}
.xg{display:flex;gap:8px;margin:6px 0;font-size:12px;flex-wrap:wrap} .xg div{background:#0e1731;padding:6px 10px;border-radius:10px}
.verdict{font-weight:900;color:#00ff88} .btn{width:100%;background:#FFD700;color:#000;border:0;padding:12px;border-radius:12px;font-weight:900;margin-top:8px}
.tabs{display:flex;gap:6px;overflow:auto} .tab{padding:8px 14px;border-radius:20px;background:#121a33;white-space:nowrap} .tab.active{background:#FFD700;color:#000}
</style>

<div class="h1">Five AIs. <span>One verdict.</span> Every match.</div>
<div class="sub">ROSA-BET PRO pairs our engine with ChatGPT, Claude, Gemini and Grok - like scorecastpro.ai</div>

<div class="tabs" id="tabs"></div>
<div id="list">Chargement...</div>

<script>
const API="https://rosa-bet-server.onrender.com/api/odds";
const dates=["14/10","15/10","16/10","17/10","18/10"];
document.getElementById("tabs").innerHTML=dates.map((d,i)=>`<div class="tab ${i==1?'active':''}" onclick="load('${d}',this)">${d}</div>`).join("");

async function load(date,el){
 if(el){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); el.classList.add("active");}
 document.getElementById("list").innerHTML="Chargement "+date+"...";
 try{
  let r=await fetch(API+"?t="+Date.now()); 
  let j=await r.json();
  let matches = j.matches || [];
  let html = matches.map(m=>{
    let league = (m.league_key || m.league || 'epl').toString().toUpperCase();
    let time = m.commence_time ? new Date(m.commence_time).toLocaleTimeString().slice(0,5) : '20:00';
    let ai = m.ai || {};
    let models = ai.models || {"ROSA PRO":"82%","ChatGPT":"78%","Claude":"75%","Gemini":"81%","Grok":"79%"};
    let xg = ai.xg || {live: "2.34", trend: "+0.18 last 5 min", home:"1.9", away:"0.8"};
    let proba = ai.proba || {"1":"55","X":"25","2":"20"};
    return `
   <div class="card">
    <div class="top"><span>${league} • ${time}</span><span class="conf">${ai.confidence||82}% AI Confidence</span></div>
    <div style="font-size:18px;font-weight:900;margin:6px 0">${m.home_team} vs ${m.away_team}</div>
    <div class="models">
      <div class="m"><b>${models["ROSA PRO"]}</b>ROSA PRO</div>
      <div class="m"><b>${models["ChatGPT"]}</b>ChatGPT</div>
      <div class="m"><b>${models["Claude"]}</b>Claude</div>
      <div class="m"><b>${models["Gemini"]}</b>Gemini</div>
      <div class="m"><b>${models["Grok"]}</b>Grok</div>
    </div>
    <div class="xg"><div>Live xG ${xg.live} <span style="color:#00ff88">${xg.trend}</span></div><div>AI Consensus ${ai.consensus||'4 / 5'}</div><div class="verdict">${ai.verdict||'Home Win'}</div></div>
    <div style="font-size:12px;color:#8a93b5">${ai.detail||''} - Score: ${ai.score_exact||'2 - 0'} - xG ${xg.home} vs ${xg.away}</div>
    <div style="font-size:12px;margin-top:4px">1: ${proba["1"]}% | X: ${proba["X"]}% | 2: ${proba["2"]}% | ${ai.btts||'OUI'} BTTS | Over 2.5: ${ai.over_2_5||'OUI'}</div>
    <button class="btn">Voir les 5 analyses → ${ai.consensus||'4/5'} ${ai.verdict||''}</button>
   </div>`;
  }).join("");
  document.getElementById("list").innerHTML=html || "Pas de matchs";
 }catch(e){
  document.getElementById("list").innerHTML="Erreur API: "+e.message
 }
}
load("15/10");
</script>
