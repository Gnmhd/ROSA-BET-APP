<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSA-BET PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;color:white;padding-bottom:110px}
.header{background:#FFD700;color:#000;padding:15px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0;z-index:10}
.card{background:#161616;margin:12px;border-radius:16px;padding:14px;border:1px solid #222}
.match{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222}
.team{font-weight:600;font-size:15px}
.league{font-size:11px;color:#888}
.odd{background:#FFD700;color:#000;padding:7px 14px;border-radius:20px;font-weight:900;min-width:65px;text-align:center}
.btn-analyse{width:100%;background:#FFD700;color:#000;border:none;padding:16px;border-radius:12px;font-weight:900;margin-top:12px}
.tab{display:none}
.tab.active{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px 0 30px 0;border-top:1px solid #222;z-index:20}
.bottom button{background:none;border:none;color:#666;font-size:11px;text-align:center;flex:1}
.bottom button.active{color:#FFD700}
.analyse-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.analyse-box{background:#222;border-radius:12px;padding:12px;text-align:center}
.analyse-box b{color:#FFD700;font-size:16px;display:block}
.badge-live{background:red;color:white;padding:2px 6px;border-radius:4px;font-size:9px;margin-left:6px}
</style>
</head>
<body>
<div class="header">ROSA-BET PRO 🔥</div>

<!-- ONGLET MATCHS -->
<div id="tab-matchs" class="tab active">
<div class="card">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">📅 MATCHS + COTES LIVE</b><small id="liveCount" style="color:#0f0">● LIVE</small></div>
<div id="matches" style="margin-top:10px">Chargement cotes réelles...</div>
<button class="btn-analyse" onclick="showTab('analyse')">🔍 ANALYSE ROSA-BET V12</button>
</div>
</div>

<!-- ONGLET ANALYSE -->
<div id="tab-analyse" class="tab">
<div class="card">
<b style="color:#FFD700">📊 ANALYSE V12 - IA ROSA</b>
<div id="selectedMatch" style="margin:10px 0;color:#888;font-size:13px">Sélectionne un match d'abord</div>
<div class="analyse-grid">
<div class="analyse-box"><b id="p1">Over 2.5</b><span id="c1">85%</span></div>
<div class="analyse-box"><b id="p2">Over 9.5 Corners</b><span id="c2">78%</span></div>
<div class="analyse-box"><b id="p3">GG OUI</b><span id="c3">72%</span></div>
<div class="analyse-box"><b id="p4">2-1</b><span id="c4">Score exact</span></div>
</div>
<button class="btn-analyse" onclick="generateProno()" style="margin-top:15px">🎯 Générer nouveau prono</button>
</div>
</div>

<!-- ONGLET PRONOS -->
