<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROSA-BET - Five AIs One Verdict</title>
<style>
body{margin:0;background:#080c1a;color:#e6ebff;font-family:system-ui;padding:12px}
.h1{font-size:26px;font-weight:900;text-align:center;margin:10px 0} .h1 span{color:#FFD700}
.sub{color:#8a93b5;text-align:center;margin-bottom:12px}
.card{background:#121a33;border:1px solid #1f2a52;border-radius:16px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;font-size:12px;color:#8a93b5}
.conf{background:#1a2a5e;color:#FFD700;padding:4px 8px;border-radius:20px;font-weight:800}
.models{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.m{background:#0e1731;border-radius:10px;padding:6px;text-align:center;font-size:11px} .m b{display:block;color:#FFD700;font-size:13px}
.xg{display:flex;gap:8px;margin:6px 0;font-size:12px;flex-wrap:wrap} .xg div{background:#0e1731;padding:6px 10px;border-radius:10px}
.verdict{font-weight:900;color:#00ff88} .btn{width:100%;background:#FFD700;color:#000;border:0;padding:12px;border-radius:12px;font-weight:900;margin-top:8px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow:auto} .tab{padding:8px 14px;border-radius:20px;background:#121a33;white-space:nowrap} .tab.active{background:#FFD700;color:#000}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:99;padding:20px;overflow:auto}
#modalContent{background:#121a33;border-radius:16px;padding:16px;max-width:500px;margin:40px auto}
.oddBox{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.oddBox div{background:#0e1731;border:1px solid #FFD700;padding:8px 12px;border-radius:10px;font-weight:800}
</style>

<div class="h1">Five AIs. <span>One verdict.</span> Every match.</div>
<div class="sub">ROSA-BET PRO pairs our engine with ChatGPT, Claude, Gemini and Grok - like scorecastpro.ai</div>
<div class="tabs" id="tabs"></div>
<div id="list">Chargement...</div>

<div id="modal" onclick="this.style.display='none'"><div id="modalContent"></div></div>

<script>
const API="https://rosa-bet-server.onrender.com/api/odds";
document.getElementById("tabs").innerHTML=["14/10","15/10","16/10","17/10","18/10"].map((d,i)=>`<div class="tab ${i==2?'active':''}" onclick="load()">${d}</div>`).join("");

let ALL=[];
async function load(){
 document.getElementById("list").innerHTML="Chargement...";
 try{
  let r=await fetch(API+"?t="+Date.now()); let j=await r.json();
  ALL=j.matches||[];
  document.getElementById("list").innerHTML=ALL.map((m,i)=>`
   <div class="card">
    <div class="top"><span>${(m.league_key||'EPL').toUpperCase()} • ${new Date(m.commence_time).toLocaleTimeString().slice(0,5)}</span><span class="conf">${m.ai.confidence}% AI Confidence</span></div>
    <div style="font-size:18px;font-weight:900;margin:6px 0">${m.home_team} vs ${m.away_team}</div>
    <div class="models">
      <div class="m"><b>${m.ai.models["ROSA PRO"]}</b>ROSA PRO</div>
      <div class="m"><b>${m.ai.models["ChatGPT"]}</b>ChatGPT</div>
      <div class="m"><b>${m.ai.models["Claude"]}</b>Claude</div>
      <div class="m"><b>${m.ai.models["Gemini"]}</b>Gemini</div>
      <div class="m"><b>${m.ai.models["Grok"]}</b>Grok</div>
    </div>
    <div class="xg"><div>Live xG ${m.ai.xg.live} <span style="color:#00ff88">${m.ai.xg.trend}</span></div><div>AI Consensus ${m.ai.consensus}</div><div class="verdict">${m.ai.verdict}</div></div>
    <div style="font-size:12px">1: ${m.ai.proba["1"]}% | X: ${m.ai.proba["X"]}% | 2: ${m.ai.proba["2"]}% | ${m.ai.btts} BTTS | Over 2.5: ${m.ai.over_2_5} | xG ${m.ai.xg.home} vs ${m.ai.xg.away}</div>
    <button class="btn" onclick="openAnalyse(${i})">Voir les 5 analyses + cotes → ${m.ai.consensus} ${m.ai.verdict}</button>
   </div>`).join("");
 }catch(e){document.getElementById("list").innerHTML="Erreur: "+e.message}
}

function openAnalyse(i){
 let m=ALL[i];
 let c=m.ai.cotes||{"1":"2.10","X":"3.20","2":"3.80","Over2.5":"1.85","BTTS":"1.75"};
 document.getElementById("modalContent").innerHTML=`
  <h2 style="color:#FFD700;margin:0">${m.home_team} vs ${m.away_team}</h2>
  <p style="color:#8a93b5">${(m.league_key||'').toUpperCase()} - ${new Date(m.commence_time).toLocaleString()}</p>
  <div style="background:#0e1731;padding:12px;border-radius:12px;margin:10px 0"><b>Analyse 5 IA:</b><br>${m.ai.analyse||m.ai.detail}</div>
  <b>Probabilités IA:</b>
  <div class="oddBox"><div>1: ${m.ai.proba["1"]}%</div><div>X: ${m.ai.proba["X"]}%</div><div>2: ${m.ai.proba["2"]}%</div></div>
  <b>Cotes Marché (value bet):</b>
  <div class="oddBox"><div>1 @ ${c["1"]}</div><div>X @ ${c["X"]}</div><div>2 @ ${c["2"]}</div><div>Over 2.5 @ ${c["Over2.5"]}</div><div>BTTS @ ${c["BTTS"]}</div></div>
  <b>xG Live:</b> ${m.ai.xg.live} (${m.ai.xg.home} vs ${m.ai.xg.away}) - ${m.ai.xg.trend}<br>
  <b>Score exact IA:</b> ${m.ai.score_exact} - ${m.ai.verdict} - Confiance ${m.ai.confidence}%<br><br>
  <button class="btn" onclick="document.getElementById('modal').style.display='none'">Fermer</button>
 `;
 document.getElementById("modal").style.display="block";
}
load();
</script>
