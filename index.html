<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSA-BET PRO - SERVER LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:white;padding-bottom:110px}
.header{background:#FFD700;color:#000;padding:15px;text-align:center;font-weight:900}
.card{background:#161616;margin:12px;border-radius:16px;padding:14px;border:1px solid #222}
.match{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222}
.team{font-weight:700}.league{font-size:11px;color:#888}
.odd{background:#FFD700;color:#000;padding:7px 12px;border-radius:20px;font-weight:900}
.btn-analyse{width:100%;background:#FFD700;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:12px}
.tab{display:none}.tab.active{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px 0 28px;border-top:1px solid #222}
.bottom button{background:none;border:none;color:#666;font-size:11px;flex:1}.bottom button.active{color:#FFD700}
</style>
</head>
<body>
<div class="header">ROSA-BET PRO 🟢 SERVER CONNECTÉ</div>

<div id="tab-matchs" class="tab active">
<div class="card">
<div style="display:flex;justify-content:space-between"><b style="color:#FFD700">COTES LIVE SERVEUR</b><span id="liveCount" style="color:#0f0">● connecté</span></div>
<div id="matches" style="margin-top:10px">Chargement depuis ton serveur...</div>
<button class="btn-analyse" onclick="showTab('analyse')">🔍 ANALYSE</button>
</div>
</div>

<div id="tab-analyse" class="tab"><div class="card"><b style="color:#FFD700">📊 ANALYSE V12</b><div id="selectedMatch" style="margin:10px 0;color:#888">Sélectionne un match</div><button class="btn-analyse" onclick="alert('Prono généré! Va dans Pronos')">🎯 Générer</button></div></div>
<div id="tab-pronos" class="tab"><div class="card"><b style="color:#FFD700">🏆 MES PRONOS</b><div id="myPronos">Aucun</div></div></div>
<div id="tab-profil" class="tab"><div class="card"><b style="color:#FFD700">⚙️ SERVEUR</b><p style="margin-top:10px">✅ https://rosa-bet-server.onrender.com<br>Statut: CONNECTÉ<br>Cotes: Pinnacle, Betclic live</p><button class="btn-analyse" onclick="loadMatches()">🔄 Actualiser</button></div></div>

<div class="bottom">
<button id="btn-matchs" class="active" onclick="showTab('matchs')">⚽<br>Matchs</button>
<button id="btn-analyse" onclick="showTab('analyse')">📊<br>Analyse</button>
<button id="btn-pronos" onclick="showTab('pronos')">🏆<br>Pronos</button>
<button id="btn-profil" onclick="showTab('profil')">⚙️<br>Profil</button>
</div>

<script>
const SERVER = 'https://rosa-bet-server.onrender.com';
function showTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');document.getElementById('btn-'+n).classList.add('active');}

async function loadMatches(){
  const el=document.getElementById('matches');
  el.innerHTML='Appel de ton serveur...';
  try{
    const r=await fetch(SERVER+'/api/odds');
    const data=await r.json();
    if(!data.success) throw new Error('API');
    let html='';
    data.matches.forEach(m=>{
      const book=m.bookmakers[0]; if(!book) return;
      const price=book.markets[0].outcomes[0].price;
      html+=`<div class="match" onclick="selectMatch('${m.home_team}','${m.away_team}','${price}')"><div><div class="league">${m.sport_title} • ${book.title}</div><div class="team">${m.home_team} vs ${m.away_team}</div></div><div class="odd">@${price}</div></div>`;
    });
    if(!html) html='<div style="color:#888">Pas de matchs en ce moment (00h-08h). Reviens à 18h, il y aura 20+ matchs</div>';
    el.innerHTML=html;
    document.getElementById('liveCount').innerText='● LIVE '+new Date().toLocaleTimeString().slice(0,5);
  }catch(e){
    el.innerHTML='Erreur serveur: '+e.message+'<br><small>Ton serveur Render se réveille (30s) puis réessaie</small>';
  }
}
function selectMatch(h,a,o){document.getElementById('selectedMatch').innerHTML=`<b>${h} vs ${a} @${o}</b>`; document.getElementById('myPronos').innerHTML=`<div style="background:#222;padding:10px;border-radius:10px;margin-top:8px"><b>${h} vs ${a}</b><br>🔥 @${o}</div>`+document.getElementById('myPronos').innerHTML; showTab('analyse');}
loadMatches();
setInterval(loadMatches, 120000);
</script>
</body>
</html>
