<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ROSA-BET PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;color:white;padding-bottom:90px}
.header{background:#FFD700;color:#000;padding:15px;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px}
.live-badge{background:red;color:white;padding:2px 8px;border-radius:5px;font-size:10px;margin-left:8px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.card{background:#161616;margin:12px;border-radius:16px;padding:12px;border:1px solid #222}
.match{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #222}
.match:last-child{border:none}
.team{font-weight:600;font-size:15px}
.league{font-size:11px;color:#888;margin-bottom:2px}
.score{font-size:11px;color:#FFD700}
.odd{background:#FFD700;color:#000;padding:6px 14px;border-radius:20px;font-weight:900;font-size:14px}
.btn-analyse{width:100%;background:#FFD700;color:#000;border:none;padding:16px;border-radius:12px;font-weight:900;font-size:16px;margin-top:12px}
.analyse-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.analyse-box{background:#222;border-radius:12px;padding:12px;text-align:center}
.analyse-box b{color:#FFD700;font-size:18px;display:block}
.analyse-box span{font-size:13px;color:#ccc}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.bottom div{text-align:center;font-size:11px;color:#666}
.bottom.active{color:#FFD700}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>

<div class="header">ROSA-BET PRO <span class="live-badge">LIVE</span></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<b style="color:#FFD700">📅 MATCHS DU JOUR - RÉELS</b>
<small id="date" style="color:#888"></small>
</div>
<div id="matches" class="loading">Chargement des vrais matchs...</div>
<button class="btn-analyse" onclick="analyseRosa()">🔍 ANALYSE ROSA-BET V12</button>
</div>

<div class="card" id="analyseCard" style="display:none">
<b style="color:#FFD700">📊 ANALYSE V12</b>
<div class="analyse-grid">
<div class="analyse-box"><b id="p1">Over 2.5</b><span id="s1">But</span></div>
<div class="analyse-box"><b id="p2">Over 9.5</b><span id="s2">Corner</span></div>
<div class="analyse-box"><b id="p3">GG OUI</b><span id="s3">Marquent</span></div>
<div class="analyse-box"><b id="p4">1-1</b><span id="s4">Score</span></div>
</div>
</div>

<div class="bottom">
<div class="active">⚽<br>Matchs</div>
<div>📊<br>Analyse</div>
<div>🏆<br>Pronos</div>
<div>⚙️<br>Profil</div>
</div>
